name: AWS OIDC Final Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          TOKEN=$(python3 - <<'PY'
          import os
          import json
          import urllib.request
          import base64

          token_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in token_url else "?"

          request = urllib.request.Request(
              f"{token_url}{separator}audience=sts.amazonaws.com"
          )

          request.add_header(
              "Authorization",
              f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"
          )

          response = urllib.request.urlopen(request)
          data = json.load(response)

          print(data["value"])
          PY
          )

          export TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]

          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("OIDC issuer:")
          print(claims.get("iss"))

          print("OIDC audience:")
          print(claims.get("aud"))

          print("OIDC subject:")
          print(claims.get("sub"))
          PY

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::131912110087:role/backblaze-dev-github-oidc-diagnostic
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: |
          echo "AWS OIDC authentication succeeded."
          aws sts get-caller-identity