name: AWS OIDC Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws-oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::131912110087:role/backblaze-dev-github-oidc-diagnostic
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: |
          echo "AWS OIDC authentication succeeded."
          aws sts get-caller-identity