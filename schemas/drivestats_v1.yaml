schema_name: drivestats
schema_version: 1.0
description: Canonical Silver schema for the 2013 Backblaze Drive Stats baseline.

columns:
  - name: snapshot_date
    source_column: date
    datatype: Date
    nullable: false
    description: Daily observation date supplied by Backblaze.
    business_meaning: Point in time associated with the drive health observation.

  - name: drive_serial_number
    source_column: serial_number
    datatype: string
    nullable: false
    description: Physical drive serial number supplied by Backblaze.
    business_meaning: Identifier used to track an individual physical drive.

  - name: drive_model
    source_column: model
    datatype: string
    nullable: false
    description: Drive model identifier supplied by Backblaze.
    business_meaning: Identifies the hardware model being observed.

  - name: capacity_bytes
    source_column: capacity_bytes
    datatype: bigint
    nullable: true
    description: Drive capacity expressed in bytes.
    business_meaning: Physical storage capacity of the drive.

  - name: failure_flag
    source_column: failure
    datatype: int
    nullable: false
    description: Drive failure indicator supplied by Backblaze.
    business_meaning: Indicates whether the drive was reported as failed for the observation.

  - name: smart_1_normalized
    source_column: smart_1_normalized
    datatype: int
    nullable: true
    description: Normalized SMART attribute 1 value supplied by Backblaze.
    business_meaning: Normalized SMART measurement for attribute 1.

  - name: smart_1_raw
    source_column: smart_1_raw
    datatype: bigint
    nullable: true
    description: Raw SMART attribute 1 value supplied by Backblaze.
    business_meaning: Raw SMART measurement for attribute 1.

